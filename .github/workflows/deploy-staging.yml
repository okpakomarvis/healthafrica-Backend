name: CI/CD Render Deployment

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Provide local profile for tests
        run: |
          if [ ! -f src/main/resources/application-local.yml ]; then
            cp src/main/resources/application-local.yml.example \
               src/main/resources/application-local.yml
          fi

      - name: Run tests
        run: mvn -B test

  deploy:
    name: Deploy to Render (staging)
    needs: test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set. Skipping deploy."
            echo "Create a Deploy Hook in Render → Service → Settings, then add it as a GitHub Actions secret."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Staging deploy triggered."
