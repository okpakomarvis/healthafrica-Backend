server:
  port: ${PORT:8080}

spring:
  application:
    name: public-health-portal
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Hibernate 6 auto-detects PostgreSQL + PostGIS via hibernate-spatial on classpath.

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%p","logger":"%c","message":"%m"}%n'
  level:
    root: INFO
    org.healthafrica: INFO
    org.springframework.security: WARN

jwt:
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
